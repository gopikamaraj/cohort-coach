[project]
name = "cohort-coach"
version = "0.1.0"
description = "Groups primary teachers for training by the specific error their pupils make."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "sqlalchemy>=2",
  "alembic",
  "anthropic",
  "httpx",
  "python-telegram-bot>=21",
  "numpy",
  "scipy",
  "pyyaml",
  "num2words",  # spoken layer: English number words (Hindi and Tamil have their own tables)
  "python-multipart",
  "pillow",
  "google-cloud-storage",  # pilot mode: Google Cloud Storage / Firebase Storage buckets
  "boto3",  # pilot mode: private sheets bucket and published-audio bucket (S3-compatible)
  "resvg-py>=0.5",  # sprites: SVG to PNG for the bot (imported at startup by the API)
  "weasyprint>=70",  # Paper Studio: check papers as PDF (needs Pango: apt, or the GTK3 runtime)
  "fonttools",  # Paper Studio: the verifier checks every glyph is in the embedded fonts
  "pypdfium2",  # Demo Studio draws the demo sheets on the printed paper (and tests read PDFs back)
]

[project.optional-dependencies]
prod = ["psycopg[binary]"]  # managed Postgres in production
vector = ["google-cloud-firestore"]  # only for VECTOR_STORE=firestore
dev = [
  "pytest",
  "pytest-asyncio",
  "hypothesis",
  "respx",
  "ruff",
  "mypy",
  "types-PyYAML",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["real_audio: run ffmpeg for real (pilot tests use a quick stand-in otherwise)", "no_autoregister: the test registers its own users (sign-in and not-signed-in tests)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"ai/registry.py" = ["E501"]  # the five layer sentences per call read best on one line
"ai/guard/explain.py" = ["E501"]  # wording templates read best on one line
"scripts/make_synthetic_sheets.py" = ["E501"]  # the generated README text and spec tables read best on one line
"scripts/eval_results.py" = ["E501"]  # the table rows read best on one line
"scripts/browser_qa_report.py" = ["E501"]  # table rows and prose read best on one line
"services/assistant/*" = ["E501"]  # help text, status words and docstrings read best on one line
"services/api/assistant.py" = ["E501"]
"tests/assistant/*" = ["E501"]
"tools/stitch_pack/*" = ["E501"]  # generated prose and tables read best on one line
"services/papers_hub/*" = ["E501", "B008"]  # section rules and error messages read best on one line
"tests/papers_hub/*" = ["E501"]
"evals/runners/assistant_eval.py" = ["E501"]  # report table rows
"scripts/extract_deck.py" = ["E501"]
"tests/test_dockerfile.py" = ["E501"]
"services/tester/*" = ["E501"]
"scripts/export_testing_stats.py" = ["E501"]  # table rows read best on one line  # SQL view text and field lists read best on one line
"tests/api/test_tester.py" = ["E501"]  # sample payloads
"scripts/speech_*.py" = ["E501"]  # printed report lines and the rating page read best on one line

[tool.mypy]
python_version = "3.12"
files = [
  "engine",
  "ai/validators",
  "services/papers/generator.py",
  "services/papers/verifier.py",
  "services/papers/rules.py",
]
strict = true
