# Intervention pack text for a cohort's errors (Part E). Every section is assembled in code from
# this file, the strategy library (content/strategies) and the explanations file. Nothing here is
# generated by AI. A section with no text here is left out of the pack and logged, not invented.
# status: draft. TODO-HUMAN(Seema): review every line against the team's subtraction materials.
# Worked examples use numbers that are not on Form A or Form B (a test scans for that).
# Hindi and Tamil: not written yet. The app shows English with a note.
# CONTENT GAPS written by the autopilot (listed in docs/build/autopilot/REPORT.md): every section
# below, the strategy steps and materials, and the PV-REVERSE strategy, which the library did not cover.
version: 1
status: draft
source: Written by the build from the strategy library; not yet reviewed by a person
errors:
  PV-HEARD:
    two_minute_check:
      en: Say "sixty-two" to three children, one at a time, and ask each to write it. Then ask each to build it with bundles and say how many bundles and loose sticks. Notice who writes 602.
    ten_minute_activity:
      en: Small group with bundles of ten and loose sticks. Say a number, the group builds it, one child writes it under the sticks, and the group reads the written number back aloud. Do six numbers, two of them with a zero in the ones place.
    teaching_mistakes:
      en:
        - Dictating many numbers fast, so children copy the sound and not the place.
        - Marking only the final answer and not asking how the child wrote it.
    at_home:
      en:
        - Ask a child to make a number from sticks or stones in bundles of ten and write it on the ground or a slate.
        - Ask her to read a house number or a price aloud and say how many tens and ones it has.
    if_not_improving:
      en: Go back to building and reading two-digit numbers only, and add place-value cards (tens card laid over the ones card) before writing.
  PV-REVERSE:
    two_minute_check:
      en: Show a number built from 3 bundles and 6 loose sticks. Ask three children to write it. Notice who writes the ones digit first.
    ten_minute_activity:
      en: Small group with place-value cards. Build a number with bundles, lay the tens card and the ones card to match, then swap the cards to make the reversed number and compare the two with the sticks.
    teaching_mistakes:
      en:
        - Reading a number ones-first while writing it tens-first, without saying so.
    at_home:
      en:
        - Ask a child to find two numbers made from the same two digits and say which is bigger and why.
    if_not_improving:
      en: Spend a week on reading numbers aloud tens first, always with bundles in front of the child, before any writing.
  ADD-NOCARRY:
    two_minute_check:
      en: Give one addition where the ones add to more than ten. Ask the child to add it with bundles and sticks. Notice whether she ties ten loose sticks into a new bundle.
    ten_minute_activity:
      en: Small group with bundles and loose sticks. Build the first number, add the second number's sticks, and tie ten loose sticks into a bundle before writing the answer. Do four sums that carry and two that do not.
    teaching_mistakes:
      en:
        - Showing the carry as a small written digit without showing where the ten comes from.
        - Only giving sums that carry, so children carry every time.
    at_home:
      en:
        - Ask a child to count 20 stones in two piles, put them together, and say how many tens and ones.
    if_not_improving:
      en: Practise "ten ones make one ten" with sticks alone before any written sum. Then add the written sum afterwards, with the sticks beside it.
  SUB-SFL:
    two_minute_check:
      en: Write a subtraction where the ones digit on top is smaller. Ask one child "is 2 take away 6 the same as 6 take away 2?" and listen. Then ask her to do the whole sum with bundles.
    ten_minute_activity:
      en: Small group with bundles. Build the top number, say "I need more ones", open a bundle into ten loose sticks, then take away. The group says each step aloud. Do four sums that need an opened bundle and two that do not.
    teaching_mistakes:
      en:
        - Teaching "borrow" as a rule to follow without showing a bundle being opened.
        - Giving only sums that need borrowing, so children stop checking whether they need it.
    at_home:
      en:
        - Ask a child to take 8 sticks away from a bundle and 3 loose sticks, and tell how she did it.
    if_not_improving:
      en: Try subtracting in parts or subtracting a nearby ten (see the other strategies), or practise one step at a time - open a bundle, count the ones, count the tens.
  SUB-NODEC:
    two_minute_check:
      en: Give one subtraction that needs borrowing. Ask the child to show it with bundles and tell you what happens to the tens after she opens a bundle.
    ten_minute_activity:
      en: Small group with bundles. Every time a bundle is opened, the child moves one bundle from the tens side to the ones side and says "one ten fewer". Do four sums, then check each one by adding back.
    teaching_mistakes:
      en:
        - Writing the small "1" next to the ones digit but not crossing out the tens digit.
    at_home:
      en:
        - Ask a child to open one bundle of ten sticks and say how many bundles and how many loose sticks she has now.
    if_not_improving:
      en: Add the check by adding back to every sum, so a missing step shows at once.
# Strategy steps and simple materials, for the strategies in content/strategies.
strategy_details:
  show_bundles:
    materials:
      en: Bundles of ten sticks, loose sticks, a cloth or mat
    steps:
      en:
        - Build the number with bundles and loose sticks.
        - Ask the child to say how many tens and how many ones.
        - Do the sum with the sticks, then write it.
  exchange_ten:
    materials:
      en: Bundles of ten sticks, loose sticks
    steps:
      en:
        - Build the top number.
        - Ask "can I take this many from the loose sticks?"
        - If not, open one bundle into ten loose sticks and count again.
  ask_explain:
    materials:
      en: None
    steps:
      en:
        - Ask "How did you get that?"
        - Listen all the way through before saying whether it is right.
        - Ask her to show the same step with sticks.
  check_back:
    materials:
      en: Slate or notebook
    steps:
      en:
        - Add the answer to the number taken away.
        - It must give the first number back.
        - If it does not, find the step that changed it.
  decomposition:
    materials:
      en: Bundles of ten sticks, loose sticks
    steps:
      en:
        - Take away the tens first.
        - Take away the ones in two steps, through the next ten.
        - Say the whole sum aloud at the end.
  compensation:
    materials:
      en: A number line drawn on the ground or slate
    steps:
      en:
        - Choose a number close to a ten.
        - Take away the ten, then give back what you took too much.
  order_probe:
    materials:
      en: None
    steps:
      en:
        - Ask one child "is 2 take away 6 the same as 6 take away 2?"
        - Listen for why. Do not correct her yet.
# A strategy for an error the library does not cover. status: draft.
extra_strategies:
  PV-REVERSE:
    - id: say_build_write
      label:
        en: Say it, build it, write it
      description:
        en: Say a number tens first, build it with bundles, then write the tens digit and then the ones digit.
      materials:
        en: Bundles of ten sticks, loose sticks, place-value cards
      steps:
        en:
          - Say the number tens first ("six tens and one").
          - Build it with bundles and loose sticks.
          - Write the tens digit, then the ones digit, under the sticks.
