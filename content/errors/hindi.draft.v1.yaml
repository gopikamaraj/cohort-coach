version: 1
language: hi
status: draft
explanations:
  PV-HEARD:
    what: "बच्चा संख्या को वैसे ही लिखता है जैसे वह बोली जाती है। वह संख्या के हिस्से (सैकड़ा, दहाई, इकाई) एक के बाद एक लिखता है, हर हिस्सा अपनी अलग संख्या के रूप में।"
    why: "संख्या हिस्सों में बोली जाती है, जैसे सैकड़ा, दहाई और इकाई। बच्चा हर हिस्से को शून्यों के साथ पूरा लिख देता है, हर अंक को उसके अपने स्थान पर रखने के बजाय।"
    spot: "आपके बोले हुए अंक के लिए बहुत ज़्यादा अंकों वाली संख्या, या बीच में एक शून्य।"
    first: "दस-दस की गड्डियों और खुली तीलियों से संख्या बनाइए। फिर गड्डियों के नीचे उसे लिखवाइए।"
  PV-REVERSE:
    what: "बच्चा दहाई का अंक और इकाई का अंक उलटा लिखता है।"
    why: "कुछ संख्या-नाम पहले इकाई बोलते हैं, इसलिए बच्चा अंकों को उसी क्रम में लिखता है जिसमें वह उन्हें सुनता है।"
    spot: "सही अंक ग़लत स्थानों पर, जैसे संख्या उलटी लिखी हो।"
    first: "उससे गड्डियों से संख्या बनवाइए। पहले गड्डियाँ गिनवाइए, फिर खुली तीलियाँ।"
  ADD-NOCARRY:
    what: "जब इकाइयों का जोड़ दस या उससे ज़्यादा होता है, तो बच्चा उस दस को दहाई के स्तंभ में हासिल के रूप में ले जाना भूल जाता है।"
    why: "वह हर स्तंभ को अलग-अलग जोड़ता है और केवल इकाई का अंक लिख देता है। अतिरिक्त दस खो जाता है।"
    spot: "उत्तर दस कम होता है, और इकाई का अंक सही होता है।"
    first: "गड्डियों से जोड़िए। जब दस खुली तीलियाँ हो जाएँ, तो उन्हें बाँधकर एक नई गड्डी बनाइए और दहाई की ओर रख दीजिए।"
  SUB-SFL:
    what: "हर स्तंभ में बच्चा बड़े अंक में से छोटा अंक घटा देता है, भले ही छोटा अंक ऊपर हो।"
    why: "वह हर स्तंभ को अलग देखता है और सकारात्मक उत्तर चाहता है, इसलिए सवाल को पलट देता है। उसे अभी यह नहीं दिखता कि एक दहाई खोलकर दस और इकाइयाँ मिल सकती हैं।"
    spot: "हर स्तंभ में उत्तर होता है, पर उत्तर जितना होना चाहिए उससे बड़ा होता है। किसी स्तंभ में उधार का निशान नहीं होता।"
    first: "सवाल गड्डियों से दिखाइए। जब खुली तीलियाँ कम पड़ें, तो एक गड्डी खोलकर दोबारा गिनिए।"
  SUB-NODEC:
    what: "बच्चा इकाई के स्तंभ के लिए एक दहाई उधार लेता है, पर दहाई के स्तंभ में से एक कम नहीं करता।"
    why: "उसने इकाइयों में दस जोड़ना सीख लिया है, पर दहाई के अंक को एक घटाने वाला क़दम छूट जाता है।"
    spot: "इकाई का स्तंभ सही होता है, और दहाई का स्तंभ एक ज़्यादा होता है।"
    first: "गड्डियों का प्रयोग कीजिए। हर बार जब गड्डी खोली जाए, तो घटाने से पहले दहाई की ओर से एक गड्डी हटाइए।"
  ADD-WHOLE-ONES:
    what: "बच्चा दहाइयाँ और इकाइयाँ अलग-अलग जोड़कर दोनों जोड़ पास-पास लिख देता है।"
    why: "वह स्तंभ-दर-स्तंभ सही जोड़ता है, पर अभी दोनों जोड़ों को एक संख्या में नहीं मिलाता।"
    spot: "दो जोड़ों को साथ रखने से बनी एक लंबी संख्या।"
    first: "उससे गड्डियों और खुली तीलियों से जोड़वाइए, फिर उत्तर लिखने से पहले दस खुली तीलियों को एक गड्डी में बँधवाइए।"
intervention:
  PV-HEARD:
    two_minute_check: "तीन बच्चों से, एक-एक करके, कहिए “बासठ” और हर एक से लिखवाइए। फिर हर एक से गड्डियों से उसे बनवाइए और बताने को कहिए कि कितनी गड्डियाँ और कितनी खुली तीलियाँ हैं। देखिए कि कौन {pv:602} लिखता है।"
    ten_minute_activity: "दस की गड्डियों और खुली तीलियों के साथ छोटा समूह। एक संख्या बोलिए, समूह उसे बनाए, एक बच्चा तीलियों के नीचे उसे लिखे, और समूह लिखी संख्या को ज़ोर से पढ़े। छह संख्याएँ कीजिए, उनमें से दो में इकाई के स्थान पर शून्य हो।"
    teaching_mistakes:
      - "बहुत सारी संख्याएँ तेज़ी से बोलकर लिखवाना, जिससे बच्चे स्थान देखे बिना आवाज़ की नक़ल करते हैं।"
      - "केवल अंतिम उत्तर जाँचना और यह न पूछना कि बच्चे ने उसे कैसे लिखा।"
    at_home:
      - "किसी बच्चे से तीलियों या पत्थरों को दस-दस की गड्डियों में बाँधकर संख्या बनाने और उसे ज़मीन या स्लेट पर लिखने को कहिए।"
      - "उससे घर का नंबर या कोई दाम ज़ोर से पढ़वाइए और बताने को कहिए कि उसमें कितनी दहाई और कितनी इकाई है।"
    if_not_improving: "केवल दो अंकों की संख्याएँ बनाने और पढ़ने पर लौट आइए, और लिखने से पहले स्थानीय मान के कार्ड (दहाई का कार्ड इकाई के कार्ड के ऊपर रखकर) जोड़िए।"
  PV-REVERSE:
    two_minute_check: "तीन गड्डियों और छह खुली तीलियों से बनी एक संख्या दिखाइए। तीन बच्चों से उसे लिखवाइए। देखिए कि कौन इकाई का अंक पहले लिखता है।"
    ten_minute_activity: "स्थानीय मान के कार्डों के साथ छोटा समूह। गड्डियों से एक संख्या बनाइए, उसके अनुसार दहाई का कार्ड और इकाई का कार्ड रखिए, फिर कार्ड बदलकर उलटी संख्या बनाइए और तीलियों से दोनों की तुलना कीजिए।"
    teaching_mistakes:
      - "संख्या को इकाई से पहले बोलना और दहाई से पहले लिखना, और यह बात बताए बिना छोड़ देना।"
    at_home:
      - "किसी बच्चे से एक ही दो अंकों से बनी दो संख्याएँ ढूँढ़ने और बताने को कहिए कि कौन-सी बड़ी है और क्यों।"
    if_not_improving: "लिखने से पहले एक हफ़्ता संख्याओं को दहाई से शुरू करके ज़ोर से पढ़ने पर लगाइए, हमेशा बच्चे के सामने गड्डियाँ रखकर।"
  ADD-NOCARRY:
    two_minute_check: "एक जोड़ दीजिए जिसमें इकाइयों का जोड़ दस से ज़्यादा हो। बच्चे से गड्डियों और तीलियों से उसे जोड़ने को कहिए। देखिए कि क्या वह दस खुली तीलियों को बाँधकर नई गड्डी बनाता है।"
    ten_minute_activity: "गड्डियों और खुली तीलियों के साथ छोटा समूह। पहली संख्या बनाइए, दूसरी संख्या की तीलियाँ जोड़िए, और उत्तर लिखने से पहले दस खुली तीलियों को गड्डी में बाँधिए। चार जोड़ जिनमें हासिल लगे और दो जिनमें न लगे, कीजिए।"
    teaching_mistakes:
      - "हासिल को एक छोटे लिखे अंक के रूप में दिखाना, बिना यह दिखाए कि दस कहाँ से आया।"
      - "केवल वही जोड़ देना जिनमें हासिल लगता है, जिससे बच्चे हर बार हासिल लगा देते हैं।"
    at_home:
      - "किसी बच्चे से बीस पत्थरों को दो ढेरों में गिनने, उन्हें मिलाने, और बताने को कहिए कि कितनी दहाई और कितनी इकाई हैं।"
    if_not_improving: "लिखे हुए जोड़ से पहले केवल तीलियों से “दस इकाई मिलकर एक दहाई” का अभ्यास कीजिए। फिर तीलियों को बगल में रखकर लिखा हुआ जोड़ जोड़िए।"
  SUB-SFL:
    two_minute_check: "एक घटाव लिखिए जिसमें ऊपर का इकाई अंक छोटा हो। एक बच्चे से पूछिए “दो में से छह घटाना और छह में से दो घटाना क्या एक ही है?” और सुनिए। फिर उससे पूरा सवाल गड्डियों से करवाइए।"
    ten_minute_activity: "गड्डियों के साथ छोटा समूह। ऊपर की संख्या बनाइए, कहिए “मुझे और इकाइयाँ चाहिए”, एक गड्डी खोलकर दस खुली तीलियाँ कीजिए, फिर घटाइए। समूह हर क़दम ज़ोर से बोले। चार सवाल जिनमें गड्डी खोलनी पड़े और दो जिनमें न खोलनी पड़े, कीजिए।"
    teaching_mistakes:
      - "उधार लेने को एक नियम की तरह सिखाना, बिना गड्डी खुलती दिखाए।"
      - "केवल वही सवाल देना जिनमें उधार लेना पड़ता है, जिससे बच्चे यह जाँचना बंद कर देते हैं कि उसकी ज़रूरत है या नहीं।"
    at_home:
      - "किसी बच्चे से एक गड्डी और तीन खुली तीलियों में से आठ तीलियाँ निकालने को कहिए और पूछिए कि उसने कैसे किया।"
    if_not_improving: "हिस्सों में घटाना या पास की दहाई घटाना आज़माइए (दूसरी युक्तियाँ देखिए), या एक-एक क़दम का अभ्यास कीजिए: गड्डी खोलिए, इकाइयाँ गिनिए, दहाइयाँ गिनिए।"
  SUB-NODEC:
    two_minute_check: "एक घटाव दीजिए जिसमें उधार लेना पड़े। बच्चे से उसे गड्डियों से दिखाने को कहिए और बताने को कहिए कि गड्डी खोलने के बाद दहाइयों का क्या होता है।"
    ten_minute_activity: "गड्डियों के साथ छोटा समूह। हर बार गड्डी खुलने पर बच्चा दहाई की ओर से एक गड्डी इकाई की ओर ले जाए और कहे “एक दहाई कम”। चार सवाल कीजिए, फिर हर एक को जोड़कर जाँचिए।"
    teaching_mistakes:
      - "इकाई के अंक के पास छोटा एक लिख देना, पर दहाई के अंक को न काटना।"
    at_home:
      - "किसी बच्चे से दस तीलियों की एक गड्डी खोलने और बताने को कहिए कि अब उसके पास कितनी गड्डियाँ और कितनी खुली तीलियाँ हैं।"
    if_not_improving: "हर सवाल में जोड़कर जाँचना जोड़िए, ताकि छूटा हुआ क़दम तुरंत दिख जाए।"
strategy_descriptions:
  show_bundles: "शिक्षक दस-दस की तीलियों की गड्डियों और खुली तीलियों से संख्या बनाता है, ताकि बच्चा दहाई और इकाई को हाथ में पकड़ी जा सकने वाली चीज़ों के रूप में देखे।"
  exchange_ten: "जब घटाने के लिए खुली तीलियाँ कम पड़ें, तो शिक्षक एक गड्डी खोलता है। एक गड्डी कम, दस खुली तीलियाँ ज़्यादा।"
  ask_explain: "शिक्षक पूछता है “तुमने यह कैसे निकाला?” और सही या ग़लत कहने से पहले ध्यान से सुनता है।"
  check_back: "घटाने के बाद, उत्तर को छोटी संख्या में जोड़िए। इससे बड़ी संख्या वापस मिलनी चाहिए। छूटा हुआ उधार तुरंत दिख जाता है।"
  decomposition: "पहले दहाइयाँ घटाइए, फिर इकाइयाँ घटाइए, एक दहाई से होकर पुल बनाते हुए, गड्डियों से दिखाते हुए।"
  compensation: "दस के पास की संख्या के लिए, दस घटाइए, फिर जो ज़्यादा घटा उसे वापस दीजिए।"
  order_probe: "एक सवाल जो दिखाता है कि क्या बच्चा सोचता है कि छोटा अंक किसी भी क्रम में बड़े अंक में से घटाया जा सकता है। इसे एक बच्चे के साथ प्रयोग कीजिए, पूरी कक्षा के साथ नहीं।"
strategy_details:
  show_bundles:
    materials: "दस-दस तीलियों की गड्डियाँ, खुली तीलियाँ, एक कपड़ा या चटाई"
    steps:
      - "गड्डियों और खुली तीलियों से संख्या बनाइए।"
      - "बच्चे से पूछिए कि कितनी दहाई और कितनी इकाई हैं।"
      - "तीलियों से सवाल कीजिए, फिर उसे लिखिए।"
  exchange_ten:
    materials: "दस-दस तीलियों की गड्डियाँ, खुली तीलियाँ"
    steps:
      - "ऊपर की संख्या बनाइए।"
      - "पूछिए “क्या मैं खुली तीलियों में से इतनी निकाल सकता हूँ?”"
      - "अगर नहीं, तो एक गड्डी खोलकर दस खुली तीलियाँ कीजिए और फिर गिनिए।"
  ask_explain:
    materials: "None"
    steps:
      - "पूछिए “तुमने यह कैसे निकाला?”"
      - "सही है या नहीं कहने से पहले पूरी बात सुनिए।"
      - "उससे वही क़दम तीलियों से दिखाने को कहिए।"
  check_back:
    materials: "स्लेट या कॉपी"
    steps:
      - "उत्तर को घटाई गई संख्या में जोड़िए।"
      - "इससे पहली संख्या वापस मिलनी चाहिए।"
      - "अगर नहीं मिलती, तो वह क़दम खोजिए जिसने उसे बदला।"
  decomposition:
    materials: "दस-दस तीलियों की गड्डियाँ, खुली तीलियाँ"
    steps:
      - "पहले दहाइयाँ घटाइए।"
      - "इकाइयों को अगली दहाई से होकर दो क़दमों में घटाइए।"
      - "अंत में पूरा सवाल ज़ोर से बोलिए।"
  compensation:
    materials: "ज़मीन या स्लेट पर बनी संख्या-रेखा"
    steps:
      - "दस के पास की कोई संख्या चुनिए।"
      - "दस घटाइए, फिर जो ज़्यादा घटा उसे वापस दीजिए।"
  order_probe:
    materials: "None"
    steps:
      - "एक बच्चे से पूछिए “दो में से छह घटाना और छह में से दो घटाना क्या एक ही है?”"
      - "सुनिए कि क्यों। अभी उसे सुधारिए मत।"
extra_strategies:
