explanations:
  PV-HEARD:
    what: "குழந்தை ஒரு எண்ணை அது ஒலிக்கும் விதத்திலேயே எழுதுகிறது. நூறு, பத்து, ஒன்று என்ற பகுதிகளை ஒன்றன்பின் ஒன்றாக, ஒவ்வொன்றையும் தனி எண்ணாக எழுதுகிறது."
    why: "ஒரு எண் நூறுகள், பத்துகள், ஒன்றுகள் என்று பகுதிகளாகச் சொல்லப்படுகிறது. குழந்தை ஒவ்வொரு பகுதியையும் பூஜ்ஜியங்களுடன் முழுமையாக எழுதுகிறது; ஒவ்வொரு இலக்கத்தையும் அதனதன் இடத்தில் வைப்பதில்லை."
    spot: "நீங்கள் சொல்லிக் கொடுத்த எண்ணுக்கு அதிக இலக்கங்கள் அல்லது நடுவில் ஒரு பூஜ்ஜியம் இருக்கும்."
    first: "பத்துக் கட்டுகளையும் தனிக்குச்சிகளையும் வைத்து எண்ணை உருவாக்குங்கள். பிறகு கட்டுகளுக்குக் கீழே அதை எழுதச் சொல்லுங்கள்."
  PV-REVERSE:
    what: "குழந்தை பத்தின் இலக்கத்தையும் ஒன்றின் இலக்கத்தையும் மாற்றி எழுதுகிறது."
    why: "சில எண் பெயர்கள் ஒன்றுகளை முதலில் சொல்கின்றன. அதனால் குழந்தை கேட்கும் வரிசையிலேயே இலக்கங்களை எழுதுகிறது."
    spot: "சரியான இலக்கங்கள் தவறான இடங்களில் இருக்கும்; எண் பின்னாலிருந்து முன்னாக எழுதியது போலத் தெரியும்."
    first: "கட்டுகளால் எண்ணை உருவாக்கச் சொல்லுங்கள். முதலில் கட்டுகளை எண்ணுங்கள், பிறகு தனிக்குச்சிகளை எண்ணுங்கள்."
  ADD-NOCARRY:
    what: "ஒன்றுகளின் கூட்டுத்தொகை பத்து அல்லது அதற்கு மேல் வரும்போது, குழந்தை அந்தப் பத்தைப் பத்துகள் நிரலுக்கு எடுத்துச் செல்ல மறந்துவிடுகிறது."
    why: "ஒவ்வொரு நிரலையும் தனித்தனியாகக் கூட்டி, ஒன்றுகளின் இலக்கத்தை மட்டும் எழுதுகிறது. கூடுதலாக வந்த பத்து விடுபடுகிறது."
    spot: "விடை பத்து குறைவாக இருக்கும்; ஒன்றுகளின் இலக்கம் சரியாக இருக்கும்."
    first: "கட்டுகளால் கூட்டுங்கள். பத்துத் தனிக்குச்சிகள் சேர்ந்தால், அவற்றை ஒரு புதிய கட்டாகக் கட்டி, பத்துகள் பக்கம் நகர்த்துங்கள்."
  SUB-SFL:
    what: "ஒவ்வொரு நிரலிலும், சிறிய இலக்கம் மேலே இருந்தாலும், பெரிய இலக்கத்திலிருந்து சிறிய இலக்கத்தைக் குழந்தை கழிக்கிறது."
    why: "ஒவ்வொரு நிரலையும் தனியாகப் பார்த்து, நேர்மறை விடை வர வேண்டும் என்பதற்காகக் கணக்கைத் திருப்பிவிடுகிறது. ஒரு பத்தைப் பிரித்து இன்னும் பத்து ஒன்றுகளைப் பெறலாம் என்பது இன்னும் புரியவில்லை."
    spot: "ஒவ்வொரு நிரலுக்கும் விடை இருக்கும், ஆனால் விடை இருக்க வேண்டியதை விடப் பெரிதாக இருக்கும். எந்த நிரலிலும் கடன் குறி இருக்காது."
    first: "கட்டுகளால் கணக்கைக் காட்டுங்கள். தனிக்குச்சிகள் போதாதபோது ஒரு கட்டைப் பிரித்து மீண்டும் எண்ணுங்கள்."
  SUB-NODEC:
    what: "ஒன்றுகள் நிரலுக்காகக் குழந்தை ஒரு பத்தைக் கடன் வாங்குகிறது; ஆனால் பத்துகள் நிரலிலிருந்து ஒன்றைக் குறைப்பதில்லை."
    why: "ஒன்றுகளுடன் பத்தைச் சேர்க்கக் கற்றுக்கொண்டிருக்கிறது; ஆனால் பத்துகளின் இலக்கத்தை ஒன்று குறைக்கும் படி விடுபடுகிறது."
    spot: "ஒன்றுகள் நிரல் சரியாக இருக்கும்; பத்துகள் நிரல் ஒன்று அதிகமாக இருக்கும்."
    first: "கட்டுகளைப் பயன்படுத்துங்கள். ஒவ்வொரு முறை ஒரு கட்டைப் பிரிக்கும்போதும், கழிப்பதற்கு முன் பத்துகள் பக்கத்திலிருந்து ஒரு கட்டை எடுத்து விடுங்கள்."
  ADD-WHOLE-ONES:
    what: "குழந்தை பத்துகளையும் ஒன்றுகளையும் தனித்தனியாகக் கூட்டி, இரண்டு கூட்டுத்தொகைகளையும் அருகருகே எழுதுகிறது."
    why: "நிரல் நிரலாகச் சரியாகக் கூட்டுகிறது; ஆனால் இரண்டு கூட்டுத்தொகைகளையும் ஒரே எண்ணாக இணைக்கத் தெரியவில்லை."
    spot: "இரண்டு கூட்டல் விடைகள் இணைந்த ஒரு நீண்ட எண் இருக்கும்."
    first: "கட்டுகளையும் தனிக்குச்சிகளையும் வைத்துக் கூட்டச் சொல்லுங்கள். விடை எழுதுவதற்கு முன் பத்துத் தனிக்குச்சிகளை ஒரு கட்டாகக் கட்டச் சொல்லுங்கள்."
intervention:
  PV-HEARD:
    two_minute_check: "அறுபத்து இரண்டு என்று மூன்று குழந்தைகளிடம் ஒவ்வொருவராகச் சொல்லி எழுதச் சொல்லுங்கள். பிறகு ஒவ்வொருவரையும் கட்டுகளால் அதை உருவாக்கி, எத்தனை கட்டுகள், எத்தனை தனிக்குச்சிகள் என்று சொல்லச் சொல்லுங்கள். யார் {pv:602} என்று எழுதுகிறார்கள் என்று கவனியுங்கள்."
    ten_minute_activity: "பத்துக் கட்டுகளும் தனிக்குச்சிகளும் கொண்ட சிறு குழு. ஒரு எண்ணைச் சொல்லுங்கள்; குழு அதை உருவாக்கும்; ஒரு குழந்தை குச்சிகளுக்குக் கீழே அதை எழுதும்; குழு எழுதிய எண்ணைச் சத்தமாக வாசிக்கும். ஆறு எண்கள் செய்யுங்கள்; அவற்றில் இரண்டில் ஒன்றுகள் இடத்தில் பூஜ்ஜியம் இருக்கட்டும்."
    teaching_mistakes:
      - "நிறைய எண்களை வேகமாகச் சொல்லிக் கொடுப்பது; அதனால் குழந்தைகள் இடத்தைப் பார்க்காமல் ஒலியைப் பார்த்து எழுதுகிறார்கள்."
      - "இறுதி விடையை மட்டும் சரிபார்த்து, குழந்தை எப்படி எழுதியது என்று கேட்காமல் விடுவது."
    at_home:
      - "ஒரு குழந்தையிடம் குச்சிகள் அல்லது கற்களைப் பத்துப் பத்தாகக் கட்டி ஒரு எண்ணை உருவாக்கி, தரையிலோ சிலேட்டிலோ எழுதச் சொல்லுங்கள்."
      - "வீட்டு எண்ணையோ விலையையோ சத்தமாக வாசித்து, அதில் எத்தனை பத்துகள், எத்தனை ஒன்றுகள் என்று சொல்லச் சொல்லுங்கள்."
    if_not_improving: "இரண்டு இலக்க எண்களை உருவாக்கி வாசிப்பதற்கு மட்டும் திரும்பிச் செல்லுங்கள்; எழுதுவதற்கு முன் இடமதிப்பு அட்டைகளையும் (பத்துகள் அட்டையை ஒன்றுகள் அட்டையின் மேல் வைத்து) சேர்த்துக்கொள்ளுங்கள்."
  PV-REVERSE:
    two_minute_check: "மூன்று கட்டுகளும் ஆறு தனிக்குச்சிகளும் கொண்டு உருவாக்கிய ஒரு எண்ணைக் காட்டுங்கள். மூன்று குழந்தைகளை எழுதச் சொல்லுங்கள். யார் ஒன்றுகளின் இலக்கத்தை முதலில் எழுதுகிறார்கள் என்று கவனியுங்கள்."
    ten_minute_activity: "இடமதிப்பு அட்டைகளுடன் சிறு குழு. கட்டுகளால் ஒரு எண்ணை உருவாக்கி, அதற்கேற்ப பத்துகள் அட்டையையும் ஒன்றுகள் அட்டையையும் வையுங்கள். பிறகு அட்டைகளை இடம் மாற்றித் தலைகீழ் எண்ணை உருவாக்கி, குச்சிகளால் இரண்டையும் ஒப்பிடுங்கள்."
    teaching_mistakes:
      - "ஒரு எண்ணை ஒன்றுகளிலிருந்து தொடங்கிச் சொல்லிவிட்டு, பத்துகளிலிருந்து தொடங்கி எழுதுவது; இதை வெளிப்படையாகச் சொல்லாமல் விடுவது."
    at_home:
      - "ஒரே இரண்டு இலக்கங்களால் ஆன இரண்டு எண்களைக் கண்டுபிடித்து, எது பெரியது, ஏன் என்று சொல்லச் சொல்லுங்கள்."
    if_not_improving: "எழுதுவதற்கு முன் ஒரு வாரம், குழந்தையின் முன் எப்போதும் கட்டுகளை வைத்துக்கொண்டு, எண்களைப் பத்துகளிலிருந்து தொடங்கிச் சத்தமாக வாசிப்பதில் செலவிடுங்கள்."
  ADD-NOCARRY:
    two_minute_check: "ஒன்றுகளின் கூட்டுத்தொகை பத்துக்கு மேல் வரும் ஒரு கூட்டல் கணக்கைக் கொடுங்கள். கட்டுகளையும் குச்சிகளையும் வைத்துக் கூட்டச் சொல்லுங்கள். பத்துத் தனிக்குச்சிகளை ஒரு புதிய கட்டாகக் கட்டுகிறதா என்று கவனியுங்கள்."
    ten_minute_activity: "கட்டுகளும் தனிக்குச்சிகளும் கொண்ட சிறு குழு. முதல் எண்ணை உருவாக்கி, இரண்டாவது எண்ணின் குச்சிகளைச் சேர்த்து, விடை எழுதுவதற்கு முன் பத்துத் தனிக்குச்சிகளை ஒரு கட்டாகக் கட்டுங்கள். பத்தை எடுத்துச் செல்ல வேண்டிய நான்கு கணக்குகளும், தேவையில்லாத இரண்டு கணக்குகளும் செய்யுங்கள்."
    teaching_mistakes:
      - "பத்து எங்கிருந்து வருகிறது என்று காட்டாமல், அதை ஒரு சிறிய எண்ணாக மட்டும் எழுதிக் காட்டுவது."
      - "பத்தை எடுத்துச் செல்ல வேண்டிய கணக்குகளை மட்டுமே கொடுப்பது; அதனால் குழந்தைகள் ஒவ்வொரு முறையும் எடுத்துச் செல்கிறார்கள்."
    at_home:
      - "ஒரு குழந்தையிடம் இருபது கற்களை இரண்டு குவியல்களாக எண்ணி, ஒன்றாகச் சேர்த்து, எத்தனை பத்துகள், எத்தனை ஒன்றுகள் என்று சொல்லச் சொல்லுங்கள்."
    if_not_improving: "எழுதிய கணக்குக்கு முன், குச்சிகளை மட்டும் வைத்துப் பத்து ஒன்றுகள் சேர்ந்தால் ஒரு பத்து என்று பயிற்சி செய்யுங்கள். பிறகு குச்சிகளை அருகில் வைத்துக்கொண்டு எழுதிய கணக்கைச் சேர்த்துக்கொள்ளுங்கள்."
  SUB-SFL:
    two_minute_check: "மேலே உள்ள ஒன்றுகள் இலக்கம் சிறியதாக இருக்கும் ஒரு கழித்தல் கணக்கை எழுதுங்கள். ஒரு குழந்தையிடம் இரண்டிலிருந்து ஆறு கழிப்பதும் ஆறிலிருந்து இரண்டு கழிப்பதும் ஒன்றா என்று கேட்டுக் கவனியுங்கள். பிறகு முழுக் கணக்கையும் கட்டுகளால் செய்யச் சொல்லுங்கள்."
    ten_minute_activity: "கட்டுகளுடன் சிறு குழு. மேல் எண்ணை உருவாக்கி, எனக்கு இன்னும் ஒன்றுகள் வேண்டும் என்று சொல்லி, ஒரு கட்டைப் பிரித்துப் பத்துத் தனிக்குச்சிகளாக்கி, பிறகு கழியுங்கள். ஒவ்வொரு படியையும் குழு சத்தமாகச் சொல்லும். கட்டைப் பிரிக்க வேண்டிய நான்கு கணக்குகளும், தேவையில்லாத இரண்டு கணக்குகளும் செய்யுங்கள்."
    teaching_mistakes:
      - "கடன் வாங்குதலை, கட்டு பிரிக்கப்படுவதைக் காட்டாமல், பின்பற்ற வேண்டிய விதியாகக் கற்பிப்பது."
      - "கடன் வாங்க வேண்டிய கணக்குகளை மட்டுமே கொடுப்பது; அதனால் தேவையா என்று குழந்தைகள் சரிபார்ப்பதை நிறுத்திவிடுகிறார்கள்."
    at_home:
      - "ஒரு கட்டிலிருந்தும் மூன்று தனிக்குச்சிகளிலிருந்தும் எட்டு குச்சிகளை எடுக்கச் சொல்லி, எப்படிச் செய்தது என்று சொல்லச் சொல்லுங்கள்."
    if_not_improving: "பகுதிகளாகக் கழித்தல் அல்லது அருகிலுள்ள பத்தைக் கழித்தல் முயலுங்கள் (மற்ற உத்திகளைப் பாருங்கள்); அல்லது ஒரு நேரத்தில் ஒரு படி பயிற்சி செய்யுங்கள்: கட்டைப் பிரியுங்கள், ஒன்றுகளை எண்ணுங்கள், பத்துகளை எண்ணுங்கள்."
  SUB-NODEC:
    two_minute_check: "கடன் வாங்க வேண்டிய ஒரு கழித்தல் கணக்கைக் கொடுங்கள். கட்டுகளால் அதைக் காட்டச் சொல்லி, ஒரு கட்டைப் பிரித்த பிறகு பத்துகளுக்கு என்ன ஆகிறது என்று சொல்லச் சொல்லுங்கள்."
    ten_minute_activity: "கட்டுகளுடன் சிறு குழு. ஒவ்வொரு முறை ஒரு கட்டைப் பிரிக்கும்போதும், குழந்தை பத்துகள் பக்கத்திலிருந்து ஒரு கட்டை ஒன்றுகள் பக்கம் நகர்த்தி ஒரு பத்து குறைவு என்று சொல்லும். நான்கு கணக்குகள் செய்து, ஒவ்வொன்றையும் கூட்டிச் சரிபாருங்கள்."
    teaching_mistakes:
      - "ஒன்றுகள் இலக்கத்தின் அருகில் சிறிய ஒன்றை எழுதிவிட்டு, பத்துகள் இலக்கத்தை அடிக்காமல் விடுவது."
    at_home:
      - "ஒரு பத்துக் குச்சிக் கட்டைப் பிரித்து, இப்போது எத்தனை கட்டுகள், எத்தனை தனிக்குச்சிகள் உள்ளன என்று சொல்லச் சொல்லுங்கள்."
    if_not_improving: "ஒவ்வொரு கணக்கிலும் கூட்டிச் சரிபார்ப்பதைச் சேர்த்துக்கொள்ளுங்கள்; அப்போது விடுபட்ட படி உடனே தெரியும்."
strategy_descriptions:
  show_bundles: "ஆசிரியர் பத்துக் குச்சிக் கட்டுகளாலும் தனிக்குச்சிகளாலும் எண்ணை உருவாக்குகிறார்; அதனால் பத்துகளையும் ஒன்றுகளையும் கையில் பிடிக்கக்கூடிய பொருள்களாகக் குழந்தை பார்க்கிறது."
  exchange_ten: "கழிப்பதற்குத் தனிக்குச்சிகள் போதாதபோது, ஆசிரியர் ஒரு கட்டைப் பிரிக்கிறார். ஒரு கட்டு குறைவு, பத்துத் தனிக்குச்சிகள் கூடுதல்."
  ask_explain: "ஆசிரியர் இதை எப்படிப் பெற்றாய் என்று கேட்டு, சரியா தவறா என்று சொல்வதற்கு முன் கவனமாகக் கேட்கிறார்."
  check_back: "கழித்த பிறகு, விடையைச் சிறிய எண்ணுடன் கூட்டுங்கள். பெரிய எண் கிடைக்க வேண்டும். விடுபட்ட கடன் உடனே தெரிந்துவிடும்."
  decomposition: "பத்துகளைக் கழித்து, பிறகு ஒன்றுகளை ஒரு பத்தின் வழியாகப் பாலம் அமைத்துக் கழியுங்கள்; கட்டுகளால் காட்டுங்கள்."
  compensation: "பத்துக்கு அருகில் உள்ள எண்ணுக்கு, அந்தப் பத்தைக் கழித்து, அதிகமாகக் கழித்ததைத் திருப்பிக் கொடுங்கள்."
  order_probe: "சிறிய இலக்கத்தை எந்த வரிசையிலும் பெரிய இலக்கத்திலிருந்து கழிக்கலாம் என்று குழந்தை நினைக்கிறதா என்பதைக் காட்டும் ஒரு கேள்வி. முழு வகுப்புடன் அல்ல, ஒரு குழந்தையுடன் இதைப் பயன்படுத்துங்கள்."
strategy_details:
  show_bundles:
    materials: "பத்துக் குச்சிக் கட்டுகள், தனிக்குச்சிகள், ஒரு துணி அல்லது பாய்"
    steps:
      - "கட்டுகளையும் தனிக்குச்சிகளையும் வைத்து எண்ணை உருவாக்குங்கள்."
      - "எத்தனை பத்துகள், எத்தனை ஒன்றுகள் என்று குழந்தையைச் சொல்லச் சொல்லுங்கள்."
      - "குச்சிகளால் கணக்கைச் செய்து, பிறகு எழுதுங்கள்."
  exchange_ten:
    materials: "பத்துக் குச்சிக் கட்டுகள், தனிக்குச்சிகள்"
    steps:
      - "மேல் எண்ணை உருவாக்குங்கள்."
      - "தனிக்குச்சிகளிலிருந்து இவ்வளவு எடுக்க முடியுமா என்று கேளுங்கள்."
      - "முடியாவிட்டால், ஒரு கட்டைப் பிரித்துப் பத்துத் தனிக்குச்சிகளாக்கி மீண்டும் எண்ணுங்கள்."
  ask_explain:
    materials: "None"
    steps:
      - "இதை எப்படிப் பெற்றாய் என்று கேளுங்கள்."
      - "சரியா என்று சொல்வதற்கு முன் முழுவதையும் கேளுங்கள்."
      - "அதே படியைக் குச்சிகளால் காட்டச் சொல்லுங்கள்."
  check_back:
    materials: "சிலேட் அல்லது குறிப்பேடு"
    steps:
      - "விடையைக் கழித்த எண்ணுடன் கூட்டுங்கள்."
      - "அது முதல் எண்ணைத் திரும்பத் தர வேண்டும்."
      - "தரவில்லை என்றால், மாற்றிய படியைக் கண்டுபிடியுங்கள்."
  decomposition:
    materials: "பத்துக் குச்சிக் கட்டுகள், தனிக்குச்சிகள்"
    steps:
      - "முதலில் பத்துகளைக் கழியுங்கள்."
      - "ஒன்றுகளை அடுத்த பத்தின் வழியாக இரண்டு படிகளில் கழியுங்கள்."
      - "இறுதியில் முழுக் கணக்கையும் சத்தமாகச் சொல்லுங்கள்."
  compensation:
    materials: "தரையில் அல்லது சிலேட்டில் வரைந்த எண்கோடு"
    steps:
      - "பத்துக்கு அருகில் உள்ள ஒரு எண்ணைத் தேர்ந்தெடுங்கள்."
      - "பத்தைக் கழித்து, அதிகமாகக் கழித்ததைத் திருப்பிக் கொடுங்கள்."
  order_probe:
    materials: "None"
    steps:
      - "ஒரு குழந்தையிடம் இரண்டிலிருந்து ஆறு கழிப்பதும் ஆறிலிருந்து இரண்டு கழிப்பதும் ஒன்றா என்று கேளுங்கள்."
      - "ஏன் என்று கவனியுங்கள். இன்னும் திருத்த வேண்டாம்."
extra_strategies:
  PV-REVERSE:
    say_build_write:
      label: "சொல், உருவாக்கு, எழுது"
      description: "ஒரு எண்ணைப் பத்துகளிலிருந்து தொடங்கிச் சொல்லுங்கள்; கட்டுகளால் உருவாக்குங்கள்; பிறகு பத்துகள் இலக்கத்தையும் அதன்பின் ஒன்றுகள் இலக்கத்தையும் எழுதுங்கள்."
      materials: "பத்துக் குச்சிக் கட்டுகள், தனிக்குச்சிகள், இடமதிப்பு அட்டைகள்"
      steps:
        - "எண்ணைப் பத்துகளிலிருந்து தொடங்கிச் சொல்லுங்கள் (ஆறு பத்துகளும் ஒன்றும்)."
        - "கட்டுகளாலும் தனிக்குச்சிகளாலும் அதை உருவாக்குங்கள்."
        - "குச்சிகளுக்குக் கீழே பத்துகள் இலக்கத்தையும் பிறகு ஒன்றுகள் இலக்கத்தையும் எழுதுங்கள்."
