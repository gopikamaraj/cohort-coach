# The strategy library (addendum v3.1 sections D and E). A strategy is approved per error; the
# status moves draft -> in_review -> approved -> active -> retired through the two keys
# (services/content/versions.py). Worked examples are never items of Form A or Form B
# (tests/content/test_track_content.py and the content scan prove it).
# Provenance: the strategies come from the team's subtraction materials. No worksheet text or item
# is copied here.
# TODO-HUMAN(Seema): review every description and worked example.
# TODO-HUMAN(Shivani): Hindi terms for borrowing/regrouping, decomposition and compensation.
# TODO-HUMAN(Gopi): Tamil wording.
version: 1
strategies:
  show_bundles:
    status: draft
    fits: [PV-HEARD, ADD-NOCARRY, SUB-SFL, SUB-NODEC]
    label:
      en: Show it with bundles of ten
      hi: दस की गड्डियों से दिखाना
      ta: பத்து கட்டுகளால் காட்டுதல்
    description:
      en: The teacher builds the number with bundles of ten sticks and loose sticks, so the child sees tens and ones as things she can hold.
    worked_examples:
      - "83 - 47 = 36: 8 bundles and 3 loose sticks; take away 4 bundles and 7 sticks."
    # the example above is a subtraction; a module on another error uses the one for its own error
    worked_by_error:
      PV-HEARD:
        - "Say sixty-two. Build it with 6 bundles and 2 loose sticks, then ask the child to write what she built."
      ADD-NOCARRY:
        - "38 + 27: 3 bundles and 8 sticks, 2 bundles and 7 sticks. 8 + 7 is 15 sticks, so make a new bundle: 6 bundles and 5 sticks."
  exchange_ten:
    status: draft
    fits: [SUB-SFL, SUB-NODEC]
    label:
      en: Open a bundle to get ten loose sticks
      hi: एक गड्डी खोलकर दस खुली तीलियाँ लेना
      ta: ஒரு கட்டைப் பிரித்துப் பத்து தனிக்குச்சிகள் எடுத்தல்
    description:
      en: When there are not enough loose sticks to take away, the teacher opens one bundle. One bundle fewer, ten more loose sticks.
    worked_examples:
      - "91 - 56 = 35: 1 loose stick is too few to take 6; open a bundle, now 11 loose sticks and 8 bundles."
  ask_explain:
    status: draft
    fits: [PV-HEARD, ADD-NOCARRY, SUB-SFL, SUB-NODEC]
    label:
      en: Ask the child to explain her steps
      hi: बच्चे से अपने कदम समझाने को कहना
      ta: குழந்தையிடம் தன் படிகளை விளக்கச் சொல்லுதல்
    description:
      en: The teacher asks "How did you get that?" and listens before saying whether it is right.
    worked_examples:
      - "Ask: how did you get 47 for 62 - 29? The child says: 9 minus 2 is 7, and 6 minus 2 is 4."
    worked_by_error:
      PV-HEARD:
        - "Ask: how did you get 602 for sixty-two? The child says: I wrote sixty, then two."
      ADD-NOCARRY:
        - "Ask: how did you get 55 for 38 + 27? The child says: 8 plus 7 is 15, I wrote 5 and forgot the ten."
      SUB-SFL:
        - "Ask: how did you get 47 for 62 - 29? The child says: 9 minus 2 is 7, and 6 minus 2 is 4."
      SUB-NODEC:
        - "Ask: how did you get 44 for 72 - 38? The child says: I took a ten for the 2, then took 3 from 7."
  check_back:
    status: draft
    fits: [ADD-NOCARRY, SUB-SFL, SUB-NODEC]
    label:
      en: Check by adding back
      hi: जोड़कर जाँचना
      ta: கூட்டிச் சரிபார்த்தல்
    description:
      en: After a subtraction, add the answer to the smaller number. It must give the bigger number. A dropped borrow shows up at once.
    worked_examples:
      - "72 - 38 = 34, check: 34 + 38 = 72."
  decomposition:
    status: draft
    fits: [SUB-SFL, SUB-NODEC]
    label:
      en: Subtract in parts (decomposition)
      hi: हिस्सों में घटाना
      ta: பகுதிகளாகக் கழித்தல்
    description:
      en: Subtract the tens, then the ones, bridging through a ten, shown with bundles.
    worked_examples:
      - "63 - 28: take away 2 bundles (63 - 20 = 43), then 8 sticks in two steps: 3 to reach 40, then 5 more, so 63 - 28 = 35."
  compensation:
    status: draft
    fits: [SUB-SFL, SUB-NODEC]
    label:
      en: Subtract a nearby ten, then adjust (compensation)
      hi: पास की दहाई घटाकर ठीक करना
      ta: அருகிலுள்ள பத்தைக் கழித்துச் சரிசெய்தல்
    description:
      en: For a number close to a ten, subtract the ten, then give back what was taken too much.
    worked_examples:
      - "63 - 29: take away 30 (63 - 30 = 33), then give 1 back, so 63 - 29 = 34."
  order_probe:
    status: draft
    fits: [SUB-SFL]
    label:
      en: Order probe (is 2 - 6 the same as 6 - 2?)
      hi: क्रम की जाँच (क्या 2 - 6 और 6 - 2 एक ही हैं?)
      ta: வரிசைச் சோதனை (2 - 6 என்பதும் 6 - 2 என்பதும் ஒன்றா?)
    description:
      en: One question that shows whether a child thinks the smaller digit can be taken from the bigger one in any order. Use it with one child, not the whole class.
    worked_examples:
      - "Ask: is 2 - 6 the same as 6 - 2? Listen for why."
