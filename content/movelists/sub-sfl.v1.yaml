  description:
    en: The teacher asks how the child got the answer.
    hi: शिक्षक पूछता है कि बच्चे ने जवाब कैसे निकाला।
    ta: குழந்தை பதிலை எப்படிப் பெற்றது என்று ஆசிரியர் கேட்கிறார்.
  examples:
    en:
    - Tell me how you got 37.
    - What did you do first?
    hi:
    - बताओ, तुमने 37 कैसे निकाला?
    - पहले तुमने क्या किया?
    ta:
    - 37 எப்படி வந்தது என்று சொல்.
    - முதலில் என்ன செய்தாய்?
- id: show_bundles
