    ta: ஆசிரியர் முறையை மாற்றாமல் அதே விதியை மேலும் உரக்கச் சொல்கிறார்.
  examples:
    en:
    - I said it already! Take the smaller from the bigger!
    hi:
    - मैंने बताया न! छोटी को बड़ी में से घटाओ!
    ta:
    - நான் சொல்லிவிட்டேனே! சிறியதைப் பெரியதிலிருந்து கழி!
  sample_lines:
    en:
    - I said it already. Take the smaller number from the bigger number. Listen carefully.
    hi:
    - मैं बता चुकी हूँ। छोटी संख्या को बड़ी संख्या में से घटाओ। ध्यान से सुनो।
    ta:
    - நான் ஏற்கனவே சொன்னேன். சிறிய எண்ணைப் பெரிய எண்ணிலிருந்து கழி. கவனமாகக் கேள்.
- id: give_the_answer
  behaviour: agree
  strength: 0.0
  engagement: -0.1
  quiet: false
