- id: decomposition
  behaviour: work_aloud
  strength: -0.3
  engagement: 0.1
  quiet: false
  quality: strong
  strategy: true
  label:
    en: Subtracts the tens, then the ones, bridging through a ten
    hi: पहले दहाइयाँ, फिर इकाइयाँ घटाना, दस के पुल से
    ta: முதலில் பத்துகள், பிறகு ஒன்றுகளைக் கழித்தல், பத்தின் வழியாக
  description:
    en: The teacher takes away the tens first, then the ones in two steps through the next ten, with bundles.
    hi: शिक्षक पहले दहाइयाँ हटाता है, फिर इकाइयाँ दो चरणों में, अगले दस से होकर, गट्ठरों के साथ।
    ta: ஆசிரியர் முதலில் பத்துகளை எடுக்கிறார், பிறகு அடுத்த பத்தின் வழியாக இரண்டு படிகளில் ஒன்றுகளை, கட்டுகளுடன்.
  examples:
    en:
    - Take away 2 bundles first, then the sticks in two steps.
    hi:
    - पहले 2 गट्ठर हटाओ, फिर तीलियाँ दो कदमों में।
    ta:
    - முதலில் 2 கட்டுகளை எடு, பிறகு குச்சிகளை இரண்டு படிகளில்.
  sample_lines:
    en:
    - 'Take away 2 bundles of ten first. Then take the loose sticks in two steps: first to the next ten, then the rest.'
    hi:
    - 'पहले दस के 2 गट्ठर हटाओ। फिर खुली तीलियाँ दो कदमों में हटाओ: पहले अगले दस तक, फिर बाकी।'
    ta:
    - 'முதலில் பத்துக் கட்டுகள் 2 ஐ எடு. பிறகு தனிக் குச்சிகளை இரண்டு படிகளில் எடு: முதலில் அடுத்த பத்து வரை, பிறகு மீதி.'
- id: compensation
  behaviour: work_aloud
  strength: -0.25
  engagement: 0.05
  quiet: false
  quality: strong
  strategy: true
  label:
    en: Subtracts a nearby ten, then adjusts
    hi: पास का दस घटाकर फिर सुधारना
    ta: அருகிலுள்ள பத்தைக் கழித்து, பிறகு சரிசெய்தல்
  description:
    en: For a number near a ten, the teacher subtracts the ten and then gives the extra back.
    hi: दस के पास की संख्या के लिए शिक्षक दस घटाता है और फिर ज़्यादा घटाया हुआ लौटाता है।
    ta: பத்துக்கு அருகிலுள்ள எண்ணுக்கு, ஆசிரியர் பத்தைக் கழித்து, கூடுதலாகக் கழித்ததைத் திருப்பிக் கூட்டுகிறார்.
  examples:
    en:
    - 29 is close to 30. Take away 30, then give 1 back.
    hi:
    - 29, 30 के पास है। 30 घटाओ, फिर 1 वापस जोड़ दो।
    ta:
    - 29, 30 க்கு அருகில் உள்ளது. 30 ஐக் கழி, பிறகு 1 ஐத் திருப்பிக் கூட்டு.
  sample_lines:
    en:
    - 'For 52 minus 29: 29 is close to 30. Take away 30 from 52, then give 1 back.'
    hi:
    - '52 में से 29: 29, 30 के पास है। 52 में से 30 घटाओ, फिर 1 वापस जोड़ दो।'
    ta:
    - '52 - 29: 29, 30 க்கு அருகில் உள்ளது. 52 இலிருந்து 30 ஐக் கழி, பிறகு 1 ஐத் திருப்பிக் கூட்டு.'
