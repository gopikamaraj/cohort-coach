  sample_lines:
    en:
    - Let us show 52 with bundles of ten and loose sticks.
    hi:
    - आओ, 52 को दस-दस के गट्ठर और खुली तीलियों से दिखाएँ।
    ta:
    - 52 ஐப் பத்துக் கட்டுகளாலும் தனிக் குச்சிகளாலும் காட்டுவோம்.
  label:
    en: Uses bundles of ten sticks
    hi: दस-दस के गट्ठर और खुली तीलियाँ इस्तेमाल करना
    ta: பத்து குச்சிக் கட்டுகளைப் பயன்படுத்துதல்
  description:
    en: The teacher shows the number as bundles of ten and loose sticks (or taps the materials).
    hi: शिक्षक संख्या को दस के गट्ठर और खुली तीलियों से दिखाता है (या सामग्री दबाता है)।
    ta: ஆசிரியர் எண்ணைப் பத்து கட்டுகளாகவும் தனிக் குச்சிகளாகவும் காட்டுகிறார் (அல்லது பொருட்களைத் தொடுகிறார்).
  examples:
    en:
    - 'Here is 52: 5 bundles and 2 sticks. Take away 9 sticks.'
    hi:
    - 'यह 52 है: 5 गट्ठर और 2 तीलियाँ। अब 9 तीलियाँ हटाओ।'
    ta:
    - 'இது 52: 5 கட்டுகள், 2 குச்சிகள். இப்போது 9 குச்சிகளை எடு.'
- id: exchange_ten
  behaviour: work_aloud
  strength: -0.3
  engagement: 0.1
  quiet: false
  quality: strong
  strategy: true
  sample_lines:
    en:
    - You only have 2 loose sticks. Open one bundle and exchange it for ten sticks.
    hi:
    - तुम्हारे पास सिर्फ़ 2 खुली तीलियाँ हैं। एक गट्ठर खोलो और दस तीलियाँ ले लो।
    ta:
    - உன்னிடம் 2 தனிக் குச்சிகள் மட்டுமே உள்ளன. ஒரு கட்டைப் பிரித்து பத்துக் குச்சிகளாக மாற்று.
  label:
    en: Opens a bundle to exchange it for ten sticks
    hi: एक गट्ठर खोलकर दस तीलियाँ बनाना
    ta: ஒரு கட்டைப் பிரித்துப் பத்து குச்சிகளாக மாற்றுதல்
  description:
    en: The teacher opens a bundle so the child has enough loose sticks to take away.
    hi: शिक्षक एक गट्ठर खोलता है ताकि बच्चे के पास घटाने भर की तीलियाँ हों।
    ta: கழிக்கப் போதுமான குச்சிகள் கிடைக்க ஆசிரியர் ஒரு கட்டைப் பிரிக்கிறார்.
  examples:
    en:
    - 'You only have 2 loose ones. Open a bundle: now you have 12.'
    hi:
    - तुम्हारे पास सिर्फ़ 2 तीलियाँ हैं। एक गट्ठर खोलो, अब 12 हो गईं।
    ta:
    - உன்னிடம் 2 குச்சிகள்தான் உள்ளன. ஒரு கட்டைப் பிரி, இப்போது 12.
- id: check_back
  behaviour: doubt
  strength: -0.2
  engagement: 0.05
  quiet: false
  quality: strong
