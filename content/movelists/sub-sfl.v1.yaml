    en: The teacher tells the answer instead of letting the child work it out.
    hi: शिक्षक बच्चे को सोचने देने के बजाय खुद जवाब बता देता है।
    ta: குழந்தை யோசிக்க விடாமல் ஆசிரியர் பதிலைச் சொல்லிவிடுகிறார்.
  examples:
    en:
    - The answer is 23. Write 23.
    hi:
    - जवाब 23 है। 23 लिखो।
    ta:
    - பதில் 23. 23 என்று எழுது.
  sample_lines:
    en:
    - The answer is 23. Just write 23.
    hi:
    - जवाब 23 है। बस 23 लिख लो।
    ta:
    - பதில் 23. 23 என்று எழுதிவிடு.
- id: order_probe
  behaviour: explain
  strength: -0.2
  engagement: 0.05
  quiet: false
  quality: strong
  strategy: true
  label:
    en: Asks whether the order matters (2 minus 6 and 6 minus 2)
    hi: पूछना कि क्रम मायने रखता है या नहीं (2 − 6 और 6 − 2)
    ta: வரிசை முக்கியமா என்று கேட்டல் (2 - 6 மற்றும் 6 - 2)
  description:
    en: The teacher asks whether 2 minus 6 is the same as 6 minus 2, so the child sees the order matters.
    hi: शिक्षक पूछता है कि 2 − 6 और 6 − 2 एक जैसे हैं या नहीं, ताकि बच्चा देखे कि क्रम मायने रखता है।
    ta: 2 - 6 உம் 6 - 2 உம் ஒன்றா என்று ஆசிரியர் கேட்கிறார், வரிசை முக்கியம் என்று குழந்தை காண.
  examples:
    en:
    - Is 2 minus 6 the same as 6 minus 2?
    hi:
    - क्या 2 − 6 और 6 − 2 एक जैसे हैं?
    ta:
    - 2 - 6 உம் 6 - 2 உம் ஒன்றா?
  sample_lines:
    en:
    - Is 2 minus 6 the same as 6 minus 2? Show it with sticks.
    hi:
    - क्या 2 − 6 और 6 − 2 एक जैसे हैं? तीलियों से दिखाओ।
    ta:
    - 2 - 6 உம் 6 - 2 உம் ஒன்றா? குச்சிகளால் காட்டு.
