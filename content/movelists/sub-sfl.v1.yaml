  sample_lines:
    en:
    - Let us check by adding back. What is 23 plus 29?
    hi:
    - आओ, वापस जोड़कर जाँचें। 23 और 29 जोड़ो तो कितना?
    ta:
    - திரும்பக் கூட்டிச் சரிபார்ப்போம். 23 + 29 எவ்வளவு?
  label:
    en: Checks by adding back
    hi: जोड़कर जाँचना
    ta: கூட்டிச் சரிபார்த்தல்
  description:
    en: The teacher has the child add the answer and the number taken away to see if it gives the start.
    hi: शिक्षक बच्चे से उत्तर और घटाई गई संख्या जुड़वाकर देखता है कि शुरुआती संख्या बनती है या नहीं।
    ta: பதிலையும் கழித்த எண்ணையும் கூட்டி முதல் எண் வருகிறதா என்று ஆசிரியர் பார்க்கச் சொல்கிறார்.
  examples:
    en:
    - 'Let us check: 37 plus 29. Is it 52?'
    hi:
    - 'चलो जाँचें: 37 और 29 जोड़ो। क्या 52 बना?'
    ta:
    - 'சரிபார்ப்போம்: 37 உடன் 29 கூட்டு. 52 வருகிறதா?'
