# Paper Studio rules, version 1 (seeded from engine/bugs.py and the pilot test pack).
# Generated by scripts/paper_studio.py rules. A change is made as a new version in the
# app (import this file as a draft); a second person publishes it.
templates:
- id: dictate-3d
  competency: C1
  skill: Write a 3-digit number said aloud
  operation: dictate
  digit_pattern: three non-zero digits; tens and ones differ
  number_range:
  - 111
  - 999
  answer_format: a number, written in one wide box
  constraints:
    digits: 3
    nonzero: true
    tens_ne_ones: true
  bugs:
  - pv-heard
  - pv-reverse
  - pv-heard-reversed
  difficulty: none
  retired: false
- id: dictate-2d
  competency: C1
  skill: Write a 2-digit number said aloud
  operation: dictate
  digit_pattern: two non-zero digits that differ
  number_range:
  - 12
  - 98
  answer_format: a number, written in one wide box
  constraints:
    digits: 2
    nonzero: true
    tens_ne_ones: true
  bugs:
  - pv-heard
  - pv-reverse
  - pv-heard-reversed
  difficulty: none
  retired: false
- id: add-carry
  competency: C2
  skill: Add two 2-digit numbers, with carrying
  operation: add
  digit_pattern: ones total 10 or more; sum at most 99
  number_range:
  - 10
  - 99
  answer_format: a number, written in one wide box
  constraints:
    carry: required
    sum_max: 99
  bugs:
  - add-nocarry
  - add-whole-ones
  difficulty: ones_total
  retired: false
- id: add-carry-ten
  competency: C2
  skill: Add with carrying where the answer ends in zero
  operation: add
  digit_pattern: ones total exactly 10; sum at most 99
  number_range:
  - 10
  - 99
  answer_format: a number, written in one wide box
  constraints:
    carry: required
    ones_total: 10
    sum_max: 99
  bugs:
  - add-nocarry
  - add-whole-ones
  difficulty: none
  retired: false
- id: sub-no-borrow
  competency: C3
  skill: 'Take away without borrowing (anchor: can the child subtract at all)'
  operation: subtract
  digit_pattern: each digit of the first number at least the one below it
  number_range:
  - 10
  - 99
  answer_format: a number, written in one wide box
  constraints:
    borrow: forbidden
    tens_gap_min: 1
  bugs: []
  difficulty: none
  retired: false
- id: sub-borrow
  competency: C3
  skill: Take away with borrowing
  operation: subtract
  digit_pattern: ones digit on top smaller; ones gap not 5; answer at least 10
  number_range:
  - 10
  - 99
  answer_format: a number, written in one wide box
  constraints:
    borrow: required
    gap_not:
    - 5
    result_min: 10
    tens_gap_min: 2
  bugs:
  - sub-sfl
  - sub-nodec
  difficulty: ones_gap
  retired: false
- id: sub-borrow-zero
  competency: C3
  skill: Take away with borrowing where the top number ends in zero
  operation: subtract
  digit_pattern: top ones digit is zero, borrow needed; ones gap not 5
  number_range:
  - 10
  - 99
  answer_format: a number, written in one wide box
  constraints:
    borrow: required
    first_ones: 0
    gap_not:
    - 5
    result_min: 10
    tens_gap_min: 2
  bugs:
  - sub-sfl
  - sub-nodec
  difficulty: ones_gap
  retired: false
bugs:
- id: pv-heard
  fn: pv_heard
  counts_for:
