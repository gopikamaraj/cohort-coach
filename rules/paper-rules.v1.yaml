  tracked: true
  params: {}
- id: pv-heard-reversed
  fn: heard_and_reversed
  counts_for:
  - PV-HEARD
  - PV-REVERSE
  tracked: false
  params: {}
- id: add-nocarry
  fn: add_nocarry
  counts_for:
  - ADD-NOCARRY
  tracked: true
  params: {}
- id: add-whole-ones
  fn: add_whole_ones
  counts_for:
  - ADD-WHOLE-ONES
  tracked: false
  params: {}
- id: sub-sfl
  fn: sub_sfl
  counts_for:
