# One role-permission config. The server enforces `can` ids through require("<id>"); the landing-page
# dialog is generated from the same file. Every line is a string key in strings/{en,hi,ta}.json.
# `planned: P11` means the route arrives in that phase; the test lists every planned id so none
# can be forgotten, and the dialog shows it as "arrives soon" (never as available).
# `enforced_by` on a boundary names the test that proves it.
weekly_minutes:
  teacher: 20
  mentor: 30
  coach: 30
  officer: null   # OD-25: no cap set yet
permissions:
  practice.rehearse: {key: roles.can.practice_rehearse}
  check.read_sheets: {key: roles.can.check_sheets}
  profile.sync: {key: roles.can.profile_sync}
  programme.view_own: {key: roles.can.programme_own}
  judge.inspect: {key: roles.can.judge_inspect, judge_only: true}
  cohort.chat: {key: roles.can.cohort_chat}
  assistant.ask: {key: roles.can.assistant_ask}
  mentor.record: {key: roles.can.mentor_record, planned: P11}
  mentor.items_view: {key: roles.can.mentor_items}
  coach.approve_items: {key: roles.can.coach_approve}
  coach.moderate: {key: roles.can.coach_moderate}
  library.view: {key: roles.can.library_view, planned: P12}
  officer.approve_cohorts: {key: roles.can.officer_cohorts}
  officer.results: {key: roles.can.officer_results}
  officer.assign_roles: {key: roles.can.officer_assign, planned: P12}
  # The review queue and the two keys (P09). The coach's key is gate 3; the officer's switches on.
  content.review_view: {key: roles.can.content_review_view}
  content.coach_approve: {key: roles.can.content_coach_approve}
  content.officer_activate: {key: roles.can.content_officer_activate}
  content.mentor_approve: {key: roles.can.content_mentor_approve}
  content.propose: {key: roles.can.content_propose}
  # Paper Studio: papers made by code from approved rules. The rule editor and the paper review
  # queue are the coach's (the coach is the reviewer); a teacher generates and prints papers.
  papers.generate: {key: roles.can.papers_generate}
  papers.review: {key: roles.can.papers_review}
  papers.rules: {key: roles.can.papers_rules}
  papers.rules_view: {key: roles.can.papers_rules_view}
boundaries:
  role.no_client_elevation:
    key: roles.cannot.no_elevation
    enforced_by: tests/roles/test_permissions.py::test_a_production_session_cannot_enter_another_role
  teacher.never_scored:
    key: roles.cannot.teacher_not_scored
    enforced_by: tests/practice/test_call_3.py::test_scores_are_rejected
  teacher.own_class_only:
    key: roles.cannot.teacher_own_class
    planned: P12
  mentor.own_cohorts_only:
    key: roles.cannot.mentor_own_cohorts
    enforced_by: tests/cohorts/test_cohorts_api.py::test_a_mentor_sees_only_her_own_cohorts_and_never_a_member_list
  mentor.no_class_numbers:
    key: roles.cannot.mentor_no_numbers
    enforced_by: tests/cohorts/test_cohorts_api.py::test_a_mentor_gets_cohort_level_figures_only
  coach.assigned_only:
    key: roles.cannot.coach_assigned
    enforced_by: tests/cohorts/test_cohorts_api.py::test_a_coach_acts_only_on_her_assigned_cohorts
  coach.no_teacher_numbers:
    key: roles.cannot.coach_no_numbers
    enforced_by: tests/api/test_officer.py::test_a_coach_cannot_read_the_officer_views
  officer.aggregates_only:
    key: roles.cannot.officer_aggregates
    enforced_by: tests/api/test_officer.py::test_the_officer_views_carry_no_teacher_or_class_ids_and_hide_small_groups
  officer.no_approval:
    key: roles.cannot.officer_no_approval
    enforced_by: tests/content/test_review_api.py::test_only_the_coach_approves_and_the_officer_cannot
roles:
  teacher:
    card: roles.card.teacher
    holders: roles.holders.teacher
    data: roles.data.teacher
    also_on: [telegram]
    can: [assistant.ask, practice.rehearse, check.read_sheets, profile.sync, programme.view_own, cohort.chat, judge.inspect, papers.generate, papers.rules_view]
    cannot: [teacher.own_class_only, teacher.never_scored, role.no_client_elevation]
  mentor:
    card: roles.card.mentor
    holders: roles.holders.mentor
    data: roles.data.mentor
    also_on: [telegram]
    can: [assistant.ask, mentor.record, mentor.items_view, cohort.chat, content.mentor_approve, papers.generate, papers.rules_view]
    cannot: [mentor.own_cohorts_only, mentor.no_class_numbers, role.no_client_elevation]
  coach:
    card: roles.card.coach
    holders: roles.holders.coach
    data: roles.data.coach
    also_on: []
    can: [assistant.ask, coach.approve_items, coach.moderate, library.view, content.review_view, content.coach_approve, content.propose, papers.generate, papers.review, papers.rules, papers.rules_view]
    cannot: [coach.assigned_only, coach.no_teacher_numbers, role.no_client_elevation]
  officer:
    card: roles.card.officer
    holders: roles.holders.officer
    data: roles.data.officer
    also_on: []
    can: [assistant.ask, officer.approve_cohorts, officer.results, officer.assign_roles, library.view, content.review_view, content.officer_activate, content.propose]
    cannot: [officer.aggregates_only, officer.no_approval, role.no_client_elevation]
