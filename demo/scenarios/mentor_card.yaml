transcript:
  - I first ask the child to read the sum aloud, top number first.
  - Then I give them two bundles of ten and some loose sticks for the top number.
  - When the ones on top are fewer, I ask what we can do, and let them open a bundle.
  - After they write the answer, they add it back to the bottom number to check.
card:
  title: Open a bundle before you take away
  steps:
    - Read the sum aloud, top number first.
    - Make the top number with bundles of ten and loose sticks.
    - When the top ones are too few, open one bundle into ten ones.
    - Take away the ones, then the tens.
    - Check by adding the answer back to the bottom number.
  phrase: What can we do when there are not enough ones?
