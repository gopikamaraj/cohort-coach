name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - name: Install Pango (WeasyPrint renders the check papers)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install PWA deps
        run: npm ci
        working-directory: apps/pwa
      - name: Check (lint, types, tests; no secrets, no network, no paid APIs)
        run: python tasks.py check
        env:
          AI_MODE: recorded
      - name: Bundle size (fail above 1 MB compressed, warn above 400 KB)
        run: python tasks.py bundle
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/pwa
      - name: End-to-end (offline, install, languages, counts-only sync)
        run: python tasks.py e2e
      - name: Secret scan (gitleaks, whole history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --redact -v --exit-code=2
